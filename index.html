<title>まっち | リンクまとめ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 縦1カラム。リンクは動画編集ソフトのタイムライン上の「クリップ」に見立てて並べる */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --fg:#1C2230; --muted:#5E6676; --line:#D3D9E3;
  --veil:rgba(236,239,244,.82);
  --c1:#E2574C; --c2:#2E9C8F; --c3:#C9862C; --c4:#5B6CD6; --c5:#8A5BC7;
  --head:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161C; --surface:#1C2029; --fg:#EEF1F6; --muted:#98A0AF; --line:#2B313D;
  --veil:rgba(19,22,28,.86);
  --c1:#F0695E; --c2:#3DB8A9; --c3:#E0A043; --c4:#7C8AF0; --c5:#A77DE0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1C2029; --fg:#EEF1F6; --muted:#98A0AF; --line:#2B313D;
  --veil:rgba(19,22,28,.86);
  --c1:#F0695E; --c2:#3DB8A9; --c3:#E0A043; --c4:#7C8AF0; --c5:#A77DE0; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:460px;margin:0 auto;padding-block:48px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}

/* プロフィール */
.prof{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.icon{width:128px;height:128px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);
  display:grid;place-items:center;font-family:var(--head);font-size:40px;overflow:hidden;position:relative}
.icon img{width:100%;height:100%;object-fit:cover;background:#C6C6BE}
.rec{position:absolute;right:6px;bottom:10px;width:14px;height:14px;border-radius:50%;background:var(--c1);
  border:3px solid var(--surface);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-family:var(--head);font-weight:400;font-size:30px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.bio{margin:0;color:var(--muted);max-width:30em}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tags span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);
  border-radius:4px;padding:2px 8px;color:var(--muted)}

/* タイムライン */
.tl{display:flex;flex-direction:column;gap:10px;position:relative}
.ruler{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:4px;font-variant-numeric:tabular-nums}
.clip{--c:var(--c1);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  text-decoration:none;color:var(--fg);background:var(--surface);border-radius:8px;
  border:1px solid var(--line);border-left:8px solid var(--c);padding:14px 16px 14px 14px;
  position:relative;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease}
.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 5px);opacity:.35}
.clip:hover{transform:translateX(4px);box-shadow:-4px 4px 0 var(--c)}
.clip:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.glyph{width:42px;height:42px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff}
.glyph svg{width:22px;height:22px}
.txt{min-width:0;display:flex;flex-direction:column}
.name{font-weight:700;font-size:16px}
.desc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tc{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.featured{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.featured .desc,.featured .tc{color:var(--bg);opacity:.75}

/* 最新の動画 */
.latest{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:12px;transition:transform .15s ease, box-shadow .15s ease}
.latest:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--c1)}
.latest:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.lt-label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--c1)}
.lt-label i{width:8px;height:8px;border-radius:50%;background:var(--c1)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:var(--line);display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:56px;height:40px;border-radius:10px;background:var(--c1);color:#fff;display:grid;place-items:center}
.play svg{width:22px;height:22px}
.lt-title{font-weight:700;font-size:15px;line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lt-date{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  { name:"YouTube", desc:"配信・動画はこっち", url:"https://www.youtube.com/@まっちmatchi_print", color:"--c1", icon:"play", featured:true },
  { name:"TikTok",  desc:"ショート動画を投稿中", url:"https://www.tiktok.com/@lil_sushi_land",      color:"--c2", icon:"note" },
  { name:"Instagram", desc:"日常をゆるく載せてるぞ！", url:"https://www.instagram.com/matchi_print/?hl=ja", color:"--c3", icon:"cam" },
  { name:"X",       desc:"配信のお知らせ・つぶやき", url:"https://x.com/matchi_print",            color:"--c4", icon:"chat" }
];

const ICONS = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3v11.2A3.5 3.5 0 1 0 16 17V8h4V3z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('name').textContent = PROFILE.name;
document.getElementById('bio').textContent = PROFILE.bio;
document.getElementById('initial').textContent = [...PROFILE.name][0] || '?';
if (PROFILE.icon) document.getElementById('icon').insertAdjacentHTML('afterbegin', `<img src="${esc(PROFILE.icon)}" alt="">`);
if (PROFILE.icon) document.getElementById('initial').hidden = true;
document.getElementById('tags').innerHTML = PROFILE.tags.map(t => `<span>${esc(t)}</span>`).join('');
document.getElementById('links').innerHTML = LINKS.map((l, i) => `
  <a class="clip${l.featured ? ' featured' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener" style="--c:var(${l.color})">
    <span class="glyph">${ICONS[l.icon] || ICONS.play}</span>
    <span class="txt"><span class="name">${esc(l.name)}</span><span class="desc">${esc(l.desc)}</span></span>
    <span class="tc">CLIP ${String(i + 1).padStart(2, '0')}</span>
  </a>`).join('');
// 最新の動画(latest.json は GitHub が自動で更新する)
fetch('latest.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(v => {
    if (!v || !/^[\w-]{11}$/.test(v.id)) return;
    document.getElementById('latest').href = 'https://www.youtube.com/watch?v=' + v.id;
    const img = new Image();
    img.alt = '';
    img.onerror = () => img.remove();
    img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
    document.getElementById('lt-thumb').prepend(img);
    document.getElementById('lt-title').textContent = v.title || '最新の動画';
    const d = new Date(v.published);
    if (!isNaN(d)) {
      const el = document.getElementById('lt-date');
      el.textContent = d.toLocaleDateString('ja-JP') + ' 公開';
      el.hidden = false;
    }
  })
  .catch(() => {});

document.getElementById('foot').textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;

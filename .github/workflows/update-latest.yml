name: 最新動画を更新

on:
  schedule:
    - cron: "17 * * * *"   # 1時間ごと
  workflow_dispatch:        # 手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HANDLE: "まっちlil_sushi_land"   # YouTubeの @ のあとの部分
      CHANNEL_ID: ""                   # UCで始まるチャンネルID(空なら自動で調べる)
    steps:
      - uses: actions/checkout@v4

      - name: 最新動画を取得
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, os
          import xml.etree.ElementTree as ET
          H = {"User-Agent": "Mozilla/5.0", "Accept-Language": "ja"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30).read().decode("utf-8", "replace")
          cid = os.environ.get("CHANNEL_ID", "").strip()
          if not cid:
              html = get("https://www.youtube.com/@" + urllib.parse.quote(os.environ["HANDLE"]))
              m = (re.search(r'"externalId":"(UC[\w-]{22})"', html)
                   or re.search(r'channel_id=(UC[\w-]{22})', html)
                   or re.search(r'"channelId":"(UC[\w-]{22})"', html))
              if not m:
                  raise SystemExit("チャンネルIDが見つかりません。CHANNEL_ID に直接入れてください")
              cid = m.group(1)
          feed = get("https://www.youtube.com/feeds/videos.xml?channel_id=" + cid)
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          e = ET.fromstring(feed).find("a:entry", ns)
          if e is None:
              raise SystemExit("動画が見つかりません")
          data = {
              "id": e.find("yt:videoId", ns).text,
              "title": e.find("a:title", ns).text,
              "published": e.find("a:published", ns).text,
              "channel_id": cid,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print(data)
          PY

      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "最新動画を更新" && git push)
